services:
  client:
    build:
      context: ./client
      dockerfile: Dockerfile.prod
    restart: unless-stopped

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      MONGO_URL_FILE: /run/secrets/mongo-url
    secrets:
      - mongo-url
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mongo:8
    environment:
      MONGO_INITDB_ROOT_USERNAME: dymaroot
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo-admin-passe
    secrets:
      - mongo-admin-passe
    volumes:
      - type: volume
        source: dbprod
        target: /data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  reverse-proxy:
    build:
      context: ./reverseproxy
      dockerfile: Dockerfile.prod
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_started
      client:
        condition: service_started
    restart: unless-stopped

volumes:
  dbprod:
    external: true

secrets:
  mongo-url:
    file: ./secrets/mongo-url
  mongo-admin-passe:
    file: ./secrets/mongo-admin-passe
